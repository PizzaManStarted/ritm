[package]
name = "gui"
version = "0.1.0"
edition = "2024"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']

[dependencies]
eframe = {version = "0.34.2", features = ["persistence"]}
getrandom = { version = "0.4", features = ["wasm_js"] }
egui = { version = "0.34.2", features = ["color-hex"] }
egui_extras = { version = "0.34.2", features = ["svg", "gif"] }
egui_flex = "0.6.0"
egui_infinite_scroll = "0.10.0"
egui_animation = "0.11.0"
rand = "0.10.1"
log = "0.4"
ritm_core = { path = "../ritm_core" }
egui-colorgradient = "0.2.3"
unicode-segmentation = "1.13.2"
rfd = "0.17.2"
poll-promise = {version="0.3.0", features=["web"]}
wasm-bindgen-futures = "0.4"
egui_alignments = "0.3.8"
web-sys = { version = "*", features = ["Window", "Url", "File", "Blob", "HtmlAnchorElement", "BlobPropertyBag", "FilePropertyBag", "Document", "Element", "HtmlElement", "console", "Event", "EventTarget", "PointerEvent"] }
tracing-wasm = "0.2.1"
wasm-bindgen = "0.2.121"
js-sys = "0.3.98"
console_error_panic_hook = "0.1.7"
regex = "1.12.3"
image = {version = "0.25", features = ["png"]}
profiling-procmacros = "1.0.18"
include_directory = "0.1.1"
serde = "1.0.228"
i_triangle = "0.44.0"
i_overlay = "6.0.1"
phf_macros = "0.13.1"
rust-i18n = {version="4.0.0"}
puffin = "0.20.0"
puffin_http = "0.17.0"
profiling = { version = "1.0.18", features = ["profile-with-puffin"] }
ordermap = "1.2.0"
svg = "0.18.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = {version="0.3.98", features = ["Worker"]}

[profile.dev]
opt-level = 1
incremental = true
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 2

[features]
profiling = []


[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
